####### Definition of flexibility scenarios #######


# main scenarios #

LowFlex:

  electricity:
    transmission_limit: v1.5

  sector:
    bev_dsm: 2040 # set to year > 2050 to turn off bev_dsm
    bev_dsm_availability: 0.2
    v2g: false
    min_part_load_fischer_tropsch: 1
    min_part_load_methanolisation: 1
    min_part_load_methanation: 1

  must_run:
    2020:
      all:
        H2 Electrolysis: 1
    2025:
      all:
        H2 Electrolysis: 1
    2030:
      all:
        H2 Electrolysis: 1
    2035:
      all:
        H2 Electrolysis: 1
    2040:
      all:
        H2 Electrolysis: 1
    2045:
      all:
        H2 Electrolysis: 1
    2050:
      all:
        H2 Electrolysis: 1

  restrict_component_buildout: # restricts the max buildout of specified components to a fraction of the Base scenario
    only_de: false
    component_limits:
      Link:
        battery discharger: 0.50
        home battery discharger: 0.50
      Store:
        H2 Store: 0.50
        rural water tanks: 0.25
        urban decentral water tanks: 0.25
        urban decentral water pits: 0.25
        urban central water tanks: 0.25
        urban central water pits: 0.25

LowBattery:

  electricity:
    transmission_limit: v1.5

  sector:
    bev_dsm: 2040 # set to year > 2050 to turn off bev_dsm
    bev_dsm_availability: 0.2
    v2g: false

  restrict_component_buildout: # restricts the max buildout of specified components to a fraction of the Base scenario
    only_de: false
    component_limits:
      Link:
        battery discharger: 0.5
        home battery discharger: 0.5

Base:

  electricity:
    transmission_limit: v1.5

  sector:
    bev_dsm: 2030
    bev_dsm_availability: 0.5
    v2g: false


HighFlex:

  electricity:
    transmission_limit: v1.5

  sector:
    bev_dsm: 2030
    bev_dsm_availability: 0.8
    v2g: true
    iron_air_battery: true

  industry_dsm:
    enable: true
    2030:
      shift_capacity: 5  # GW
      holding_hours: 4
      compensate_hours: 24
      ramp_down_cost: 0
      compensate_cost: 0
    2035:
      shift_capacity: 6  # GW
      holding_hours: 4
    2040:
      shift_capacity: 8  # GW
      holding_hours: 4
    2045:
      shift_capacity: 10  # GW
      holding_hours: 4
    2050:
      shift_capacity: 10  # GW
      holding_hours: 4

  lines:
    dynamic_line_rating:
      activate: true

